<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="SchemeWise - Privacy-conscious health scheme discovery and eligibility guidance."
  />
  <title>SchemeWise — Health Support Navigator</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #0b7285;
      --primary-dark: #075985;
      --primary-light: #e6f7fa;
      --secondary: #2563eb;
      --green: #15803d;
      --green-light: #ecfdf3;
      --orange: #c2410c;
      --orange-light: #fff7ed;
      --red: #b91c1c;
      --red-light: #fef2f2;
      --text: #172033;
      --muted: #667085;
      --border: #e5e7eb;
      --background: #f7fafc;
      --white: #ffffff;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary-light);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      border: 0;
      background: transparent;
      padding: 9px 12px;
      border-radius: 9px;
      color: #475467;
      font-weight: 600;
      transition: .2s;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .nav-cta {
      border: 0;
      background: var(--primary);
      color: white;
      padding: 11px 17px;
      border-radius: 10px;
      font-weight: 700;
      transition: .2s;
    }

    .nav-cta:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .menu-btn {
      display: none;
      border: 1px solid var(--border);
      background: white;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      font-size: 1.25rem;
    }

    /* ================= HERO ================= */

    .hero {
      padding: 78px 0 70px;
      background:
        radial-gradient(circle at 10% 10%, rgba(11,114,133,.10), transparent 32%),
        radial-gradient(circle at 90% 20%, rgba(37,99,235,.08), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #f7fbfc 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: .82rem;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 4.25rem);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 650px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      font-weight: 750;
      transition: .2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: var(--primary-dark);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .hero-card {
      background: white;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 24px;
      padding: 26px;
    }

    .hero-card-title {
      font-weight: 800;
      margin-bottom: 18px;
    }

    .support-preview {
      display: grid;
      gap: 12px;
    }

    .support-preview-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .support-preview-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary-light);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .support-preview-item strong {
      display: block;
      font-size: .94rem;
    }

    .support-preview-item span {
      color: var(--muted);
      font-size: .8rem;
    }

    /* ================= SECTIONS ================= */

    section {
      padding: 75px 0;
    }

    .section-head {
      max-width: 720px;
      margin-bottom: 35px;
    }

    .section-head.center {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
    }

    .section-head h2 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: -.7px;
      margin-bottom: 10px;
    }

    .section-head p {
      color: var(--muted);
    }

    .section-label {
      text-transform: uppercase;
      letter-spacing: 1.4px;
      font-size: .74rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 7px;
    }

    /* ================= CARDS ================= */

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 23px;
      box-shadow: 0 3px 16px rgba(15,23,42,.025);
    }

    .feature-card {
      transition: .2s;
    }

    .feature-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--primary-light);
      font-size: 1.4rem;
      margin-bottom: 16px;
    }

    .feature-card h3 {
      margin-bottom: 7px;
      font-size: 1.05rem;
    }

    .feature-card p {
      color: var(--muted);
      font-size: .9rem;
    }

    /* ================= STEPS ================= */

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .step {
      position: relative;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 22px;
    }

    .step-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .step h3 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .step p {
      color: var(--muted);
      font-size: .88rem;
    }

    /* ================= NAVIGATOR ================= */

    .navigator {
      background: linear-gradient(180deg, #eefbfc, #f7fafc);
    }

    .navigator-box {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .progress {
      height: 7px;
      border-radius: 99px;
      background: #edf2f7;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      transition: .3s;
    }

    .question-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .question-description {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    .choice {
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      padding: 17px;
      text-align: left;
      transition: .2s;
    }

    .choice:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .choice-icon {
      font-size: 1.35rem;
      margin-bottom: 8px;
    }

    .choice strong {
      display: block;
      margin-bottom: 3px;
    }

    .choice span {
      color: var(--muted);
      font-size: .82rem;
    }

    .privacy-note {
      margin-top: 22px;
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 11px;
      color: var(--muted);
      font-size: .82rem;
      border: 1px solid var(--border);
    }

    /* ================= RESULT ================= */

    .result-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 25px;
    }

    .result-count {
      color: var(--muted);
      font-size: .9rem;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .scheme-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      transition: .2s;
    }

    .scheme-card:hover {
      border-color: #b9dfe4;
      box-shadow: var(--shadow);
    }

    .scheme-tag {
      display: inline-flex;
      padding: 5px 9px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      margin-bottom: 11px;
    }

    .scheme-card h3 {
      font-size: 1.08rem;
      margin-bottom: 7px;
    }

    .scheme-card > p {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 14px;
    }

    .match-box {
      padding: 13px;
      border-radius: 11px;
      background: var(--green-light);
      color: #166534;
      font-size: .82rem;
      margin-bottom: 14px;
    }

    .match-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: .8rem;
      font-weight: 700;
    }

    .small-btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* ================= WHY ================= */

    .why-panel {
      margin-top: 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
      background: white;
    }

    .why-panel-header {
      padding: 14px 16px;
      background: #f8fafc;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
    }

    .why-list {
      list-style: none;
      padding: 12px 16px;
    }

    .why-list li {
      display: flex;
      gap: 9px;
      padding: 7px 0;
      font-size: .85rem;
    }

    .check {
      color: var(--green);
      font-weight: 900;
    }

    .cross {
      color: var(--red);
      font-weight: 900;
    }

    .warning {
      color: var(--orange);
      font-weight: 900;
    }

    /* ================= WHAT IF ================= */

    .whatif {
      background: #f0f7ff;
    }

    .simulator {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    .form-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 23px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: .82rem;
      font-weight: 750;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #d7dce2;
      border-radius: 10px;
      padding: 11px 12px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11,114,133,.08);
    }

    .sim-result {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 23px;
      min-height: 100%;
    }

    .sim-result h3 {
      margin-bottom: 5px;
    }

    .sim-result-sub {
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: 18px;
    }

    .mini-result {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .mini-result strong {
      display: block;
      margin-bottom: 3px;
    }

    .mini-result span {
      font-size: .8rem;
      color: var(--muted);
    }

    /* ================= GAP ================= */

    .gap-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
    }

    .gap-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .gap-item:last-child {
      border-bottom: 0;
    }

    .gap-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: var(--orange-light);
      color: var(--orange);
      border-radius: 9px;
      flex-shrink: 0;
    }

    .gap-item strong {
      display: block;
      margin-bottom: 2px;
    }

    .gap-item span {
      color: var(--muted);
      font-size: .85rem;
    }

    /* ================= DIRECTORY ================= */

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .empty {
      text-align: center;
      background: white;
      border: 1px dashed #cfd6df;
      border-radius: 17px;
      padding: 45px 20px;
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .empty p {
      color: var(--muted);
      margin-bottom: 15px;
    }

    /* ================= DETAIL ================= */

    .detail-top {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 48px 0;
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 750;
      margin-bottom: 20px;
      padding: 0;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 25px;
    }

    .detail-main {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
    }

    .detail-sidebar {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      height: fit-content;
    }

    .detail-main h1 {
      font-size: 2.1rem;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .detail-main > .description {
      color: var(--muted);
      margin-bottom: 27px;
    }

    .detail-section {
      margin-bottom: 28px;
    }

    .detail-section h2 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    .detail-section ul {
      padding-left: 20px;
      color: #475467;
    }

    .detail-section li {
      margin-bottom: 6px;
    }

    .official-box {
      background: var(--primary-light);
      padding: 16px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .official-box a {
      color: var(--primary-dark);
      font-weight: 750;
      word-break: break-word;
    }

    .sidebar-title {
      font-weight: 800;
      margin-bottom: 15px;
    }

    .sidebar-item {
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      font-size: .85rem;
    }

    .sidebar-item:last-child {
      border-bottom: 0;
    }

    .sidebar-item span {
      color: var(--muted);
      display: block;
      font-size: .75rem;
    }

    /* ================= COMPARISON ================= */

    .compare-table-wrap {
      overflow-x: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 15px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
      font-size: .86rem;
    }

    th {
      background: #f8fafc;
      font-weight: 800;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    /* ================= ABOUT ================= */

    .about-hero {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 55px 0;
    }

    .about-content {
      max-width: 900px;
      margin: 0 auto;
    }

    .about-content h1 {
      font-size: 2.6rem;
      margin-bottom: 15px;
    }

    .about-content > p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .mission-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 30px;
    }

    .info-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 23px;
    }

    .info-box h3 {
      margin-bottom: 8px;
    }

    .info-box p {
      color: var(--muted);
      font-size: .9rem;
    }

    .objective-list {
      display: grid;
      gap: 12px;
    }

    .objective {
      display: flex;
      gap: 14px;
      background: white;
      border: 1px solid var(--border);
      padding: 17px;
      border-radius: 14px;
    }

    .objective-num {
      font-weight: 900;
      color: var(--primary);
      min-width: 30px;
    }

    .objective strong {
      display: block;
      margin-bottom: 3px;
    }

    .objective span {
      color: var(--muted);
      font-size: .85rem;
    }

    .developer {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 22px;
      align-items: center;
      background: white;
      border: 1px solid var(--border);
      border-radius: 19px;
      padding: 24px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 50%;
      font-size: 2rem;
      font-weight: 900;
    }

    .developer h3 {
      font-size: 1.35rem;
      margin-bottom: 3px;
    }

    .developer-role {
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .developer p {
      color: var(--muted);
      font-size: .9rem;
    }

    .developer-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 13px;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #102a43;
      color: white;
      padding: 45px 0 25px;
      margin-top: 50px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 35px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .footer-brand {
      font-size: 1.3rem;
      font-weight: 850;
      margin-bottom: 10px;
    }

    footer p {
      color: #b8c7d8;
      font-size: .86rem;
    }

    footer h4 {
      margin-bottom: 12px;
    }

    .footer-links {
      display: grid;
      gap: 7px;
    }

    .footer-links button {
      border: 0;
      background: transparent;
      color: #b8c7d8;
      text-align: left;
      padding: 0;
    }

    .footer-links button:hover {
      color: white;
    }

    .footer-bottom {
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      color: #9fb0c2;
      font-size: .76rem;
    }

    /* ================= DISCLAIMER ================= */

    .disclaimer {
      background: #fff8e7;
      border: 1px solid #f3dfaa;

/* ================= INTRO SCREEN (ORIGINAL THEME) ================= */
#scheme-intro {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 42%, rgba(11,114,133,.10), transparent 34%),
    linear-gradient(180deg, #ffffff 0%, #f7fbfc 100%);
  opacity: 1;
  visibility: visible;
  transition: opacity .65s ease, visibility .65s ease;
}
#scheme-intro.intro-hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.intro-content {
  width: min(440px, calc(100% - 40px));
  text-align: center;
  animation: intro-rise .8s cubic-bezier(.2,.8,.2,1) both;
}
.intro-mark {
  width: 82px;
  height: 82px;
  margin: 0 auto 22px;
  display: grid;
  place-items: center;
  border-radius: 25px;
  background: var(--primary-light);
  color: var(--primary-dark);
  font-size: 2.65rem;
  box-shadow: 0 12px 35px rgba(11,114,133,.13);
  animation: intro-mark-in .9s cubic-bezier(.16,1,.3,1) both;
}
.intro-name {
  color: var(--primary-dark);
  font-size: clamp(2rem, 7vw, 2.65rem);
  line-height: 1.1;
  letter-spacing: -1.5px;
  font-weight: 850;
  animation: intro-fade-up .7s .18s ease both;
}
.intro-tagline {
  margin-top: 12px;
  color: var(--muted);
  font-size: .98rem;
  animation: intro-fade-up .7s .35s ease both;
}
.intro-loader {
  width: 150px;
  height: 4px;
  margin: 34px auto 0;
  overflow: hidden;
  border-radius: 20px;
  background: #e7eef1;
  animation: intro-fade-up .6s .5s ease both;
}
.intro-loader span {
  display: block;
  width: 40%;
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
  animation: intro-loading 1.65s ease-in-out forwards;
}
.intro-skip {
  margin-top: 24px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 650;
  cursor: pointer;
  animation: intro-fade-up .6s .55s ease both;
}
.intro-skip:hover { color: var(--primary-dark); }
@keyframes intro-rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes intro-mark-in {
  0% { opacity: 0; transform: scale(.72) rotate(-8deg); }
  70% { opacity: 1; transform: scale(1.07) rotate(2deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes intro-fade-up {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes intro-loading {
  from { width: 0%; }
  to { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  #scheme-intro, .intro-content, .intro-mark, .intro-name,
  .intro-tagline, .intro-loader, .intro-skip, .intro-loader span {
    animation: none !important;
    transition: none !important;
  }
}

  border-color: rgba(255,255,255,.55) !important;
}
main > section.navigator .question-title {
  color: #173b2e !important;
}
main > section.navigator .question-description {
  color: #52665a !important;
}
main > section.navigator .choice {
  color: #1b3027 !important;
  background: #fffefa !important;
  border-color: #dce5d9 !important;
}
main > section.navigator .choice strong {
  color: #173b2e !important;
}
main > section.navigator .choice span {
  color: #52665a !important;
}
main > section.navigator .choice:hover {
  color: #103f32 !important;
  background: #edf5ee !important;
  border-color: #7fae91 !important;
}
main > section.navigator .privacy-note {
  color: #52665a !important;
  background: #f1f4eb !important;
  border-color: #dce5d9 !important;
}
main > section.navigator input,
main > section.navigator select,
main > section.navigator textarea {
  color: #1b3027 !important;
  background: #fffefa !important;
}
main > section.navigator input::placeholder,
main > section.navigator textarea::placeholder {
  color: #718076 !important;
  opacity: 1;
}
main > section.navigator button:focus-visible,
main > section.navigator input:focus-visible,
main > section.navigator select:focus-visible,
main > section.navigator textarea:focus-visible {
  outline: 3px solid #d6b66e !important;
  outline-offset: 3px;
}
@media (max-width: 780px) {
  main > section.navigator {
    background:
      radial-gradient(circle at 8% 15%, rgba(196,154,82,.16), transparent 28%),
      linear-gradient(145deg, #123f32 0%, #1b6048 65%, #254d3b 100%) !important;
  }
}

  
/* FINAL READABILITY OVERRIDE: dark text on the pale hero/background */
.section-label,
main .section-label {
  color: #28513f !important;
  opacity: 1 !important;
}
.section-head h2,
main .section-head h2 {
  color: #173b2e !important;
  opacity: 1 !important;
  text-shadow: none !important;
}
.section-head p,
main .section-head p {
  color: #405c4e !important;
  opacity: 1 !important;
  text-shadow: none !important;
}
.navigator .section-head .section-label,
.navigator .section-head h2,
.navigator .section-head p,
main > section.navigator .section-head .section-label,
main > section.navigator .section-head h2,
main > section.navigator .section-head p {
  color: #173b2e !important;
}

  
/* HOW IT WORKS: light text on dark green; dark text on cream cards */
main > section.navigator {
  background:
    radial-gradient(circle at 90% 10%, rgba(196,154,82,.13), transparent 26%),
    linear-gradient(125deg, #123f32 0%, #185b43 58%, #214c3a 100%) !important;
}
main > section.navigator > .container > .section-head .section-label {
  color: #e5c987 !important;
}
main > section.navigator > .container > .section-head h2 {
  color: #fff9ec !important;
}
main > section.navigator > .container > .section-head p {
  color: #e0ebe2 !important;
}
main > section.navigator .steps .step {
  background: #fbf7ec !important;
  color: #1b3027 !important;
  border: 1px solid #e4dfd0 !important;
}
main > section.navigator .steps .step h3 {
  color: #173b2e !important;
  opacity: 1 !important;
}
main > section.navigator .steps .step p {
  color: #52665a !important;
  opacity: 1 !important;
}
main > section.navigator .steps .step .step-number {
  color: #ffffff !important;
  background: linear-gradient(145deg, #1b8064, #105640) !important;
}

function incomeValue(income) {
  const values = {
    below1: 0.5,
    "1to3": 2,
    "3to5": 4,
    "5to8": 6.5,
    above8: 10
  };
  return values[income] || 0;
}

function ageMatches(scheme, age) {
  return age >= scheme.ageMin && age <= scheme.ageMax;
}

function calculateMatch(scheme, profile) {
  const reasons = [];
  const problems = [];

  if (profile.age !== "" && ageMatches(scheme, Number(profile.age))) {
    reasons.push(`Age ${profile.age} falls within the scheme's configured age range.`);
  } else if (profile.age !== "") {
    problems.push(
      `Age ${profile.age} does not fall within the configured age range.`
    );
  }

  if (scheme.income.includes(profile.income)) {
    reasons.push(`Income range matches the configured eligibility rule.`);
  } else {
    problems.push(`Income range may not match the configured rule.`);
  }

  if (scheme.occupations.includes(profile.occupation)) {
    reasons.push(`Occupation/category matches a configured target group.`);
  } else {
    problems.push(`Occupation/category is not listed as a direct target group.`);
  }

  if (profile.state) {
    reasons.push(`${profile.state} is included in the current directory's coverage.`);
  }

  if (profile.need && scheme.needs.includes(profile.need)) {
    reasons.push(`The scheme addresses ${needLabels[profile.need].toLowerCase()}.`);
  } else if (profile.need) {
    problems.push(`The scheme is not primarily mapped to this selected need.`);
  }

  let score = reasons.length * 20;

  if (profile.need && scheme.needs.includes(profile.need)) score += 25;
  if (profile.age !== "" && ageMatches(scheme, Number(profile.age))) score += 15;
  if (scheme.income.includes(profile.income)) score += 10;
  if (scheme.occupations.includes(profile.occupation)) score += 10;

  return {
    scheme,
    score,
    reasons,
    problems
  };
}

function getMatches(profile) {
  return schemes
    .map(scheme => calculateMatch(scheme, profile))
    .filter(result => result.score >= 45)
    .sort((a, b) => b.score - a.score);
}

/* =========================================================
   HOME
========================================================= */

function Home({ navigate }) {
  const features = [
    {
      icon: "🧭",
      title: "Smart Support Navigator",
      text: "Start with your situation and need instead of searching for a scheme name."
    },
    {
      icon: "🔍",
      title: "Explainable Eligibility",
      text: "See why a scheme appears and which conditions may not match."
    },
    {
      icon: "🔄",
      title: "What-If Simulator",
      text: "Change age, income or occupation and instantly explore another scenario."
    },
    {
      icon: "🧩",
      title: "Support Gap Detection",
      text: "If the database cannot find a relevant match, SchemeWise tells you instead of inventing one."
    }
  ];

  return (
    <>
      <main>
        <section className="hero">
          <div className="container hero-grid">
            <div>
              <div className="eyebrow">🔐 Privacy-conscious civic technology</div>

              <h1>
                Find the health support
                <span> that may fit you.</span>
              </h1>

              <p>
                SchemeWise helps you discover government health schemes based
                on your situation, understand why a scheme may match, explore
                alternative situations and reach the appropriate official source.
              </p>

              <div className="hero-actions">
                <button
                  className="btn btn-primary"
                  onClick={() => navigate("#/navigator")}
                >
                  🧭 Start Smart Navigator
                </button>

                <button
                  className="btn btn-secondary"
                  onClick={() => navigate("#/schemes")}
                >
                  Browse Schemes
                </button>
              </div>
            </div>

            <div className="hero-card">
              <div className="hero-card-title">
                From situation → support
              </div>

              <div className="support-preview">
                <div className="support-preview-item">
                  <div className="support-preview-icon">👤</div>
                  <div>
                    <strong>Tell us what you need</strong>
                    <span>No scheme name required</span>
                  </div>
                </div>

                <div className="support-preview-item">
                  <div className="support-preview-icon">⚙️</div>
                  <div>
                    <strong>Rule-based matching</strong>
                    <span>Transparent eligibility logic</span>
                  </div>
                </div>

                <div className="support-preview-item">
                  <div className="support-preview-icon">💡</div>
                  <div>
                    <strong>Understand the result</strong>
                    <span>Why / Why not explanations</span>
                  </div>
                </div>

                <div className="support-preview-item">
                  <div className="support-preview-icon">🏛️</div>
                  <div>
                    <strong>Verify officially</strong>
                    <span>Final authority remains with government sources</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div className="container">
            <div className="section-head center">
              <div className="section-label">What makes SchemeWise different</div>
              <h2>More than a scheme directory</h2>
              <p>
                SchemeWise is designed around the user's situation rather than
                forcing the user to already know which government scheme to search for.
              </p>
            </div>

            <div className="grid grid-4">
              {features.map((item, index) => (
                <div className="card feature-card" key={index}>
                  <div className="feature-icon">{item.icon}</div>
                  <h3>{item.title}</h3>
                  <p>{item.text}</p>
                </div>
              ))}
            </div>
          </div>
        </section>

        <section className="navigator">
          <div className="container">
            <div className="section-head">
              <div className="section-label">How it works</div>
              <h2>From a real-life situation to an official next step</h2>
              <p>
                SchemeWise converts structured user information into
                explainable guidance.
              </p>
            </div>

            <div className="steps">
              {[
                ["1", "Describe your need", "Choose the kind of support you are looking for."],
                ["2", "Build your situation", "Provide only basic information needed for matching."],
                ["3", "Explore results", "See potential schemes and exactly why they appeared."],
                ["4", "Verify officially", "Use the official source before making any application decision."]

                <div className="step" key={num}>
                  <div className="step-number">{num}</div>

                  <p>{text}</p>

        <section>
          <div className="container">
            <div className="card" style={{
              background: "linear-gradient(135deg,#e9f9fb,#f7fbff)",

              <div className="section-label">Try it yourself</div>
              <h2 style={{marginBottom:"9px"}}>You don't need to know the scheme name.</h2>
              <p style={{
                color:"var(--muted)",
                maxWidth:"650px",
                margin:"0 auto 20px"
              }}>
                Tell SchemeWise what kind of support you are looking for and
                let the rule engine explore the directory.

              <button
                className="btn btn-primary"
                onClick={() => navigate("#/navigator")}
              >
                Start Smart Navigator →
              </button>
            </div>
          </div>
        </section>
      </main>
    </>

/* =========================================================
   SMART NAVIGATOR
========================================================= */

function Navigator({ navigate }) {
  const [step, setStep] = useState(1);

  const [profile, setProfile] = useState({
    need: "",
    age: "",
    state: "Tamil Nadu",
    income: "1to3",
    occupation: "other"
  });

  const [results, setResults] = useState(null);

  const needs = [
    ["treatment", "Hospital treatment", "Help related to hospital or treatment expenses"],
    ["maternity", "Pregnancy & maternity", "Pregnancy, delivery and maternal support"],
    ["child", "Child healthcare", "Health services for children"],
    ["senior", "Senior citizen healthcare", "Healthcare support for older persons"],
    ["accident", "Accident protection", "Accident-related financial protection"],
    ["screening", "Screening & checkups", "Preventive screening and health checks"],
    ["financial", "Financial health support", "Health-related financial assistance"]
  ];

  function chooseNeed(need) {
    setProfile({...profile, need});
    setStep(2);
  }

  function next() {
    if (step < 4) {
      setStep(step + 1);
    } else {
      const matches = getMatches(profile);
      setResults(matches);
    }
  }

  function back() {
    if (results) {
      setResults(null);
      setStep(4);
    } else if (step > 1) {
      setStep(step - 1);
    }
  }

  if (results) {
    return (
      <section>
        <div className="container">
          <div className="section-head">
            <div className="section-label">Smart Navigator</div>
            <h2>Your Support Map</h2>
            <p>
              These are potential matches from the current SchemeWise dataset.
              They are not final eligibility decisions.
            </p>
          </div>

          <div className="card" style={{marginBottom:"22px"}}>
            <strong>Your situation</strong>

            <div style={{
              display:"flex",
              flexWrap:"wrap",
              gap:"8px",
              marginTop:"12px"
            }}>
              <span className="scheme-tag">
                {needIcons[profile.need]} {needLabels[profile.need]}
              </span>

              <span className="scheme-tag">
                Age: {profile.age}
              </span>

              <span className="scheme-tag">
                {profile.state}
              </span>

              <span className="scheme-tag">
                {incomeLabels[profile.income]}
              </span>

              <span className="scheme-tag">
                {occupationLabels[profile.occupation]}
              </span>
            </div>
          </div>

          {results.length > 0 ? (
            <>
              <div className="result-header">
                <div>
                  <h3>{results.length} potential match{results.length !== 1 ? "es" : ""}</h3>
                  <div className="result-count">
                    Ranked by rule relevance, not by an official eligibility score.
                  </div>
                </div>

                <div className="result-actions">
                  <button
                    className="small-btn"
                    onClick={() => navigate("#/what-if")}
                  >
                    🔄 Try What-If
                  </button>

                  <button
                    className="small-btn"
                    onClick={() => navigate("#/compare")}
                  >
                    🧩 Compare
                  </button>
                </div>
              </div>

              <div className="grid grid-2" style={{
                gridTemplateColumns:"repeat(2,1fr)"
              }}>
                {results.map(result => (
                  <ResultCard
                    key={result.scheme.id}
                    result={result}
                    navigate={navigate}
                  />
                ))}
              </div>
            </>
          ) : (
            <NoMatch profile={profile} navigate={navigate} />
          )}

          <div className="disclaimer">
            <strong>Important:</strong> SchemeWise provides information and
            eligibility guidance only. Final eligibility, benefit availability
            and approval are determined by the respective scheme authority.
          </div>

          <button
            className="back"
            onClick={back}
            style={{marginTop:"22px"}}
          >
            ← Change answers
          </button>
        </div>
      </section>
    );
  }

  const progress = step === 1 ? 25 : step === 2 ? 50 : step === 3 ? 75 : 100;

  return (
    <section className="navigator">
      <div className="container">
        <div className="section-head center">
          <div className="section-label">Smart Support Navigator</div>
          <h2>What kind of help are you looking for?</h2>
          <p>
            You do not need to know the name of a government scheme.
          </p>
        </div>

        <div className="navigator-box">
          <div className="progress">
            <div
              className="progress-bar"
              style={{width:`${progress}%`}}
            />
          </div>

          {step === 1 && (
            <>
              <div className="question-title">What do you need help with?</div>
              <div className="question-description">
                Choose the option closest to your situation.
              </div>

              <div className="choice-grid">
                {needs.map(([id,title,description]) => (
                  <button
                    className="choice"
                    key={id}
                    onClick={() => chooseNeed(id)}
                  >
                    <div className="choice-icon">{needIcons[id]}</div>
                    <strong>{title}</strong>
                    <span>{description}</span>
                  </button>
                ))}
              </div>
            </>
          )}

          {step === 2 && (
            <>
              <div className="question-title">Tell us the person's age</div>
              <div className="question-description">
                This is used only for the current matching calculation.
              </div>

              <div className="form-group">
                <label>Age</label>
                <input
                  type="number"
                  min="0"
                  max="120"
                  value={profile.age}
                  onChange={e =>
                    setProfile({...profile, age:e.target.value})
                  }
                  placeholder="Enter age"
                />
              </div>

              <button
                className="btn btn-primary"
                disabled={profile.age === ""}
                onClick={next}
                style={{opacity:profile.age === "" ? .5 : 1}}
              >
                Continue →
              </button>
            </>
          )}

          {step === 3 && (
            <>
              <div className="question-title">Where does the person live?</div>
              <div className="question-description">
                State information helps contextualise the directory.
              </div>

              <div className="form-group">
                <label>State / Union Territory</label>
                <select
                  value={profile.state}
                  onChange={e =>
                    setProfile({...profile, state:e.target.value})
                  }
                >
                  <option>Tamil Nadu</option>
                  <option>Kerala</option>
                  <option>Karnataka</option>
                  <option>Andhra Pradesh</option>
                  <option>Telangana</option>
                  <option>Maharashtra</option>
                  <option>Delhi</option>
                  <option>Other</option>
                </select>
              </div>

              <button className="btn btn-primary" onClick={next}>
                Continue →
              </button>
            </>
          )}

          {step === 4 && (
            <>
              <div className="question-title">A little more context</div>
              <div className="question-description">
                These details help the rule engine explain potential matches.
              </div>

              <div className="form-group">
                <label>Annual household income range</label>
                <select
                  value={profile.income}
                  onChange={e =>
                    setProfile({...profile, income:e.target.value})
                  }
                >
                  {Object.entries(incomeLabels).map(([key,label]) => (
                    <option value={key} key={key}>{label}</option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Occupation / category</label>
                <select
                  value={profile.occupation}
                  onChange={e =>
                    setProfile({...profile, occupation:e.target.value})
                  }
                >
                  {Object.entries(occupationLabels).map(([key,label]) => (
                    <option value={key} key={key}>{label}</option>
                  ))}
                </select>
              </div>

              <button className="btn btn-primary" onClick={next}>
                🔎 Find Potential Support
              </button>
            </>
          )}

          <div className="privacy-note">
            🔐 <strong>Privacy by design:</strong> SchemeWise does not ask for
            Aadhaar numbers, bank passwords, OTPs, medical records or other
            unnecessary sensitive information.
          </div>

          {step > 1 && (
            <button
              className="back"
              onClick={back}
              style={{marginTop:"17px"}}
            >
              ← Back
            </button>
          )}
        </div>
      </div>
    </section>
  );
}

  return (

          onClick={() => navigate(`#/schemes/${scheme.id}`)}

        >

/* =========================================================
   COMPARE
========================================================= */

function Compare() {
  const [selected, setSelected] = useState(
    JSON.parse(localStorage.getItem("schemeWiseCompare") || "[]")
  );

  function toggle(id) {
    let next;

    if (selected.includes(id)) {
      next = selected.filter(x => x !== id);
    } else {
      next = [...selected, id].slice(-3);
    }

    setSelected(next);
    localStorage.setItem(
      "schemeWiseCompare",
      JSON.stringify(next)
    );
  }

  const selectedSchemes = schemes.filter(s =>
    selected.includes(s.id)
  );

  return (
    <section>
      <div className="container">
        <div className="section-head">
          <div className="section-label">Decision support</div>
          <h2>Compare Schemes</h2>
          <p>
            Compare up to three schemes side by side. Comparison does not
            determine which scheme you should choose.
          </p>
        </div>

        <div className="card" style={{marginBottom:"22px"}}>
          <strong>Select schemes</strong>

          <div style={{
            display:"flex",
            flexWrap:"wrap",
            gap:"8px",
            marginTop:"12px"
          }}>
            {schemes.map(scheme => (
              <button
                key={scheme.id}
                className={`small-btn ${
                  selected.includes(scheme.id) ? "primary" : ""
                }`}
                onClick={() => toggle(scheme.id)}
              >
                {selected.includes(scheme.id) ? "✓ " : "+ "}
                {scheme.short}
              </button>
            ))}
          </div>

/* =========================================================
   ROUTER
========================================================= */

function App() {
  const [route, setRoute] = useState(window.location.hash || "#");

  useEffect(() => {
    const handler = () => {
      setRoute(window.location.hash || "#");
      window.scrollTo(0,0);
    };

    window.addEventListener("hashchange", handler);

    return () => window.removeEventListener("hashchange", handler);
  }, []);

  function navigate(path) {
    window.location.hash = path;
  }

  let content;

  if (route === "#" || route === "") {
    content = <Home navigate={navigate} />;
  }

  else if (route === "#/navigator") {
    content = <Navigator navigate={navigate} />;
  }

  else if (route === "#/eligibility") {
    content = <Eligibility navigate={navigate} />;
  }

  else if (route === "#/what-if") {
    content = <WhatIf />;
  }

  else if (route === "#/schemes") {
    content = <Schemes navigate={navigate} />;
  }

  else if (route.startsWith("#/schemes/")) {
    const id = route.split("/")[2];
    content = <SchemeDetail id={id} navigate={navigate} />;
  }

  else if (route === "#/compare") {
    content = <Compare />;
  }

  else if (route === "#/find-help") {
    content = <FindHelp navigate={navigate} />;
  }

  else if (route === "#/about") {
    content = <About />;
  }

  else {
    content = <Home navigate={navigate} />;
  }

  return (
    <>
      <Header route={route} navigate={navigate} />

      {content}

      <Footer navigate={navigate} />
    </>
  );
}
