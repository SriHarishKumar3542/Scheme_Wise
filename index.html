<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SchemeWise - Discover Indian government health schemes, check rough eligibility, and find nearby health camps." />
  <title>SchemeWise — Health Scheme Guidance</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #087f8c;
      --primary-dark: #05616b;
      --primary-light: #e7f7f8;
      --blue: #1769aa;
      --blue-light: #eaf4fc;
      --text: #16323a;
      --muted: #60767d;
      --border: #dbe7ea;
      --background: #f7fafb;
      --white: #ffffff;
      --success: #237a57;
      --success-bg: #eaf7f0;
      --warning: #9a6700;
      --warning-bg: #fff6dc;
      --danger: #a33a3a;
      --danger-bg: #fff0f0;
      --radius: 16px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(calc(100% - 32px), var(--container));
      margin: 0 auto;
    }

    /* ---------------- HEADER ---------------- */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.35rem;
      color: var(--primary-dark);
      margin-right: auto;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: var(--primary-light);
      color: var(--primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-link {
      padding: 9px 11px;
      border-radius: 9px;
      color: #405960;
      font-size: .93rem;
      font-weight: 600;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .primary-btn,
    .secondary-btn,
    .outline-btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      font-weight: 700;
      transition: .2s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .secondary-btn {
      background: var(--blue-light);
      color: var(--blue);
    }

    .secondary-btn:hover {
      background: #dcecf8;
    }

    .outline-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .outline-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .hamburger {
      display: none;
      background: white;
      border: 1px solid var(--border);
      border-radius: 9px;
      width: 42px;
      height: 42px;
    }

    /* ---------------- GENERAL ---------------- */

    .page {
      min-height: calc(100vh - 72px);
    }

    .section {
      padding: 72px 0;
    }

    .section-sm {
      padding: 45px 0;
    }

    .section-title {
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      line-height: 1.2;
      margin: 0 0 12px;
      letter-spacing: -.02em;
    }

    .section-subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 700px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .card-pad {
      padding: 24px;
    }

    .icon-box {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--primary-light);
      flex: 0 0 auto;
    }

    .icon-box.blue {
      color: var(--blue);
      background: var(--blue-light);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      background: #f0f5f6;
      color: #526970;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 700;
      margin: 3px 4px 3px 0;
    }

    .tag.primary {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .disclaimer {
      background: #fff8e7;
      border: 1px solid #f0dfae;
      border-radius: 13px;
      padding: 15px 17px;
      color: #665329;
      font-size: .88rem;
    }

    .disclaimer strong {
      color: #4e3d19;
    }

    /* ---------------- HOME ---------------- */

    .hero {
      padding: 78px 0 70px;
      background:
        radial-gradient(circle at 90% 10%, #dff5f5 0, transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f3fbfb 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 55px;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.45rem, 5vw, 4.25rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      margin: 0 0 22px;
      max-width: 800px;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero-text {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .hero-panel {
      padding: 28px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 22px;
    }

    .hero-panel-head {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 22px;
    }

    .hero-panel h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .mini-list {
      display: grid;
      gap: 13px;
    }

    .mini-list-item {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      color: #50656c;
      font-size: .92rem;
    }

    .mini-check {
      color: var(--success);
      margin-top: 3px;
      flex: 0 0 auto;
    }

    .steps-grid {
      grid-template-columns: repeat(4, 1fr);
      margin-top: 32px;
    }

    .step-card {
      padding: 24px;
      position: relative;
    }

    .step-number {
      font-size: .78rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .step-card h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .step-card p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .feature-grid {
      grid-template-columns: repeat(4, 1fr);
      margin-top: 32px;
    }

    .feature-card {
      padding: 25px;
      transition: transform .2s ease, border-color .2s ease;
    }

    .feature-card:hover {
      transform: translateY(-3px);
      border-color: #a9d9dc;
    }

    .feature-card h3 {
      margin: 17px 0 7px;
      font-size: 1.05rem;
    }

    .feature-card p {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 15px;
    }

    .text-link {
      color: var(--primary-dark);
      font-weight: 800;
      font-size: .88rem;
    }

    .closing-cta {
      background: var(--primary-dark);
      color: white;
      border-radius: 22px;
      padding: 42px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .closing-cta h2 {
      margin: 0 0 8px;
    }

    .closing-cta p {
      margin: 0;
      color: #cce8e9;
      max-width: 700px;
    }

    .privacy-note {
      font-size: .82rem;
      margin-top: 13px !important;
      color: #a9d7d9 !important;
    }

    /* ---------------- PAGE HEADER ---------------- */

    .page-header {
      padding: 52px 0 36px;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .page-header-row {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      align-items: end;
    }

    /* ---------------- FORMS ---------------- */

    .checker-shell {
      max-width: 820px;
      margin: 0 auto;
    }

    .progress {
      height: 8px;
      background: #e7eeee;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width .25s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 8px;
    }

    .form-card {
      padding: 32px;
    }

    .form-card h2 {
      margin: 0 0 8px;
    }

    .form-card > p {
      color: var(--muted);
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 28px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 750;
      font-size: .9rem;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #cddde0;
      border-radius: 10px;
      padding: 12px 13px;
      background: white;
      color: var(--text);
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8,127,140,.1);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      gap: 10px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 25px;
    }

    .choice {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: .2s ease;
      background: white;
    }

    .choice:hover,
    .choice.selected {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .choice strong {
      display: block;
      margin-bottom: 2px;
    }

    .choice span {
      color: var(--muted);
      font-size: .82rem;
    }

    /* ---------------- SCHEME CARDS ---------------- */

    .filters {
      display: grid;
      grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0;
    }

    .scheme-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .scheme-card {
      padding: 23px;
      display: flex;
      flex-direction: column;
      min-height: 290px;
    }

    .scheme-card-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .scheme-card h3 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .scheme-summary {
      color: var(--muted);
      font-size: .88rem;
      margin: 13px 0;
    }

    .scheme-card-footer {
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid #edf2f3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .scheme-meta {
      color: var(--muted);
      font-size: .78rem;
    }

    .results-count {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 15px;
    }

    /* ---------------- DETAILS ---------------- */

    .back-link {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--primary-dark);
      font-weight: 750;
      margin-bottom: 20px;
      font-size: .9rem;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.5fr .7fr;
      gap: 22px;
      align-items: start;
    }

    .detail-main,
    .detail-side {
      padding: 30px;
    }

    .detail-main h1 {
      margin: 12px 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.15;
    }

    .detail-main h2,
    .detail-side h2 {
      font-size: 1.2rem;
      margin: 30px 0 10px;
    }

    .detail-main h2:first-child {
      margin-top: 0;
    }

    .detail-main p {
      color: #50656c;
    }

    .detail-list {
      padding-left: 21px;
      color: #50656c;
    }

    .detail-list li {
      margin-bottom: 7px;
    }

    .side-block {
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 18px;
    }

    .side-block:last-child {
      border-bottom: 0;
      margin-bottom: 0;
    }

    .side-label {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 800;
    }

    .side-value {
      margin-top: 4px;
      font-weight: 700;
    }

    /* ---------------- CAMPS ---------------- */

    .camp-filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 700px;
      margin: 25px 0;
    }

    .camp-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .camp-card {
      padding: 23px;
    }

    .camp-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: .73rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.upcoming {
      background: var(--success-bg);
      color: var(--success);
    }

    .status.completed {
      background: #f0f2f3;
      color: #66767a;
    }

    .camp-card h3 {
      margin: 15px 0 4px;
      font-size: 1.05rem;
    }

    .camp-organizer {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 15px;
    }

    .camp-info {
      display: grid;
      gap: 8px;
      color: #52676d;
      font-size: .87rem;
    }

    .camp-info-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    /* ---------------- FIND HELP ---------------- */

    .help-options {
      grid-template-columns: repeat(3, 1fr);
      margin: 30px 0;
    }

    .help-option {
      padding: 25px;
      cursor: pointer;
      transition: .2s ease;
    }

    .help-option:hover,
    .help-option.selected {
      border-color: var(--primary);
      background: #fbffff;
    }

    .help-option h3 {
      margin: 15px 0 7px;
    }

    .help-option p {
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
    }

    .help-guidance {
      background: var(--primary-light);
      border: 1px solid #c8e9eb;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .help-guidance strong {
      display: block;
      margin-bottom: 5px;
      color: var(--primary-dark);
    }

    /* ---------------- ABOUT ---------------- */

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 22px;
    }

    .about-card {
      padding: 30px;
    }

    .about-card h2 {
      margin-top: 0;
    }

    .developer-box {
      background: #f3f8f9;
      border: 1px dashed #b9d1d5;
      border-radius: 14px;
      padding: 20px;
    }

    /* ---------------- EMPTY ---------------- */

    .empty {
      text-align: center;
      padding: 55px 25px;
      border: 1px dashed #cbdadc;
      border-radius: 16px;
      background: white;
    }

    .empty h3 {
      margin: 12px 0 6px;
    }

    .empty p {
      color: var(--muted);
      max-width: 550px;
      margin: 0 auto 20px;
    }

    /* ---------------- FOOTER ---------------- */

    footer {
      margin-top: 60px;
      background: #113c43;
      color: #d9ebed;
    }

    .footer-main {
      padding: 45px 0 30px;
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 45px;
    }

    .footer-brand {
      color: white;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .footer-main p {
      color: #a9c6ca;
      font-size: .86rem;
    }

    .footer-title {
      color: white;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .footer-links {
      display: grid;
      gap: 7px;
      font-size: .86rem;
    }

    .footer-links a:hover {
      color: white;
    }

    .footer-bottom {
      border-top: 1px solid #315b61;
      padding: 18px 0;
      color: #9ebbc0;
      font-size: .78rem;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    /* ---------------- RESPONSIVE ---------------- */

    @media (max-width: 1000px) {
      .nav-links {
        gap: 0;
      }

      .nav-link {
        padding: 8px;
      }

      .steps-grid,
      .feature-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .scheme-grid,
      .camp-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .detail-grid,
      .about-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .container {
        width: min(calc(100% - 24px), var(--container));
      }

      .nav {
        min-height: 64px;
      }

      .nav-links {
        display: none;
        position: absolute;
        left: 12px;
        right: 12px;
        top: 68px;
        padding: 10px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 13px;
        flex-direction: column;
        align-items: stretch;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-link {
        padding: 11px;
      }

      .nav .primary-btn {
        display: none;
      }

      .hamburger {
        display: grid;
        place-items: center;
      }

      .hero {
        padding: 55px 0;
      }

      .hero-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .hero h1 {
        font-size: 2.65rem;
      }

      .steps-grid,
      .feature-grid,
      .scheme-grid,
      .camp-grid,
      .help-options,
      .form-grid,
      .choice-grid {
        grid-template-columns: 1fr;
      }

      .filters,
      .camp-filters {
        grid-template-columns: 1fr;
      }

      .page-header-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .form-card,
      .detail-main,
      .detail-side,
      .about-card {
        padding: 22px;
      }

      .closing-cta {
        padding: 28px;
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-main {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ============================================================
       SAMPLE SCHEME DATA
       ============================================================ */

    const schemes = [
      {
        id: "pmjay",
        name: "Ayushman Bharat PM-JAY",
        summary: "Government-funded health protection scheme providing cashless hospitalization coverage to eligible families.",
        description:
          "Ayushman Bharat - Pradhan Mantri Jan Arogya Yojana (PM-JAY) provides health coverage for eligible beneficiary families for secondary and tertiary hospitalization through empanelled hospitals.",
        state: "All India",
        benefitType: "Health Insurance",
        targetGroup: ["Low-income families", "Vulnerable households", "Eligible families"],
        eligibility: {
          minAge: 0,
          maxAge: 120,
          incomeCeiling: 300000,
          occupations: ["farmer", "unorganized worker", "unemployed", "other", "student", "salaried", "self-employed", "senior citizen"],
          states: ["ALL"]
        },
        benefits: [
          "Cashless treatment at empanelled hospitals",
          "Coverage for eligible secondary and tertiary hospitalization",
          "Family-based eligibility under the scheme database"
        ],
        documentsRequired: [
          "Government-issued identity document",
          "Ration card or family identification document where applicable",
          "Beneficiary identification details"
        ],
        howToApply: [
          "Check your eligibility through the official PM-JAY beneficiary portal.",
          "Visit an Ayushman Arogya Mandir, Common Service Centre or empanelled facility where available.",
          "Complete beneficiary verification as required by the authority.",
          "Use the issued beneficiary identification for eligible treatment."
        ],
        officialUrl: "https://pmjay.gov.in/"
      },

    /* ============================================================
       ROUTER
       ============================================================ */

    function getRoute() {
      const hash = window.location.hash || "#/";
      const path = hash.replace(/^#/, "") || "/";

      if (path.startsWith("/schemes/")) {
        return {
          page: "scheme-detail",
          id: decodeURIComponent(path.split("/")[2])
        };
      }

      const valid = [
        "/",
        "/eligibility",
        "/schemes",
        "/camps",
        "/find-help",
        "/about"
      ];

      return {
        page: valid.includes(path) ? path.slice(1) || "home" : "home"
      };
    }

    function navigate(path) {
      window.location.hash = path;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ============================================================
       ELIGIBILITY CHECKER
       ============================================================ */

    function Eligibility() {
      const [step, setStep] = useState(1);
      const [form, setForm] = useState({
        age: "",
        state: "",
        income: "",
        occupation: ""
      });
      const [submitted, setSubmitted] = useState(false);

      const update = (key, value) => {
        setForm(prev => ({ ...prev, [key]: value }));
      };

      const canContinue = () => {
        if (step === 1) return Number(form.age) >= 0 && Number(form.age) <= 120;
        if (step === 2) return !!form.state;
        if (step === 3) return !!form.income;
        if (step === 4) return !!form.occupation;
        return false;
      };

      const matches = useMemo(() => {
        if (!submitted) return [];

        const age = Number(form.age);
        const income = Number(form.income);

        return schemes.filter(scheme => {
          const e = scheme.eligibility;

          const ageMatch = age >= e.minAge && age <= e.maxAge;
          const incomeMatch = income <= e.incomeCeiling;
          const occupationMatch =
            e.occupations.includes(form.occupation);

          const stateMatch =
            e.states.includes("ALL") ||
            e.states.some(
              state => state.toLowerCase() === form.state.toLowerCase()
            );

          return ageMatch && incomeMatch && occupationMatch && stateMatch;
        });
      }, [submitted, form]);

      const whyReasons = (scheme) => {
        const e = scheme.eligibility;
        const reasons = [];

        reasons.push(`Your age (${form.age}) falls within the listed age range.`);
        reasons.push(`Your selected state is covered by the scheme.`);

        if (e.incomeCeiling !== Infinity) {
          reasons.push("Your selected income range is within the scheme's sample income ceiling.");
        } else {
          reasons.push("No sample income ceiling is used for this scheme.");
        }

        reasons.push(
          `Your occupation (${form.occupation}) is included in the sample eligible groups.`
        );

        return reasons;
      };

      if (submitted) {
        return (
          <main className="page">
            <div className="page-header">
              <div className="container">
                <div className="eyebrow">Eligibility results</div>
                <h1 className="section-title">Schemes that may match you</h1>
                <p className="section-subtitle">
                  These are rough matches against the SchemeWise sample dataset,
                  not an official eligibility decision.
                </p>
              </div>
            </div>

            <section className="section-sm">
              <div className="container">
                <Disclaimer/>

                <div style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  gap: "15px",
                  margin: "28px 0 18px",
                  flexWrap: "wrap"
                }}>
                  <div>
                    <strong>{matches.length} possible match{matches.length !== 1 ? "es" : ""}</strong>
                    <div className="muted" style={{fontSize: ".85rem"}}>
                      Based on the answers entered in this session.
                    </div>
                  </div>

                  <button
                    className="outline-btn"
                    onClick={() => {
                      setSubmitted(false);
                      setStep(1);
                    }}
                  >
                    Change Answers
                  </button>
                </div>

                {matches.length > 0 ? (
                  <div className="grid scheme-grid">
                    {matches.map(scheme => (
                      <div className="card scheme-card" key={scheme.id}>
                        <div className="scheme-card-top">
                          <div>
                            <span className="tag primary">
                              {scheme.benefitType}
                            </span>
                            <h3>{scheme.name}</h3>
                          </div>
                        </div>

                        <p className="scheme-summary">{scheme.summary}</p>

                        <div>
                          <strong style={{fontSize: ".82rem"}}>
                            Why you may qualify
                          </strong>

                          <ul
                            className="detail-list"
                            style={{fontSize: ".81rem", marginBottom: 0}}
                          >
                            {whyReasons(scheme).slice(0, 3).map(reason => (
                              <li key={reason}>{reason}</li>
                            ))}
                          </ul>
                        </div>

                        <div className="scheme-card-footer">
                          <span className="scheme-meta">{scheme.state}</span>
                          <a
                            className="text-link"
                            href={"#/schemes/" + scheme.id}
                          >
                            View details →
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="empty" style={{marginTop: 25}}>
                    <div className="icon-box" style={{margin: "0 auto"}}>
                      <Icon name="search" size={22}/>
                    </div>

                    <h3>No direct matches found</h3>

                    <p>
                      This does not mean you are ineligible for government
                      assistance. The checker uses a limited sample dataset and
                      simplified rules.
                    </p>

                    <div style={{
                      display: "flex",
                      gap: "10px",
                      justifyContent: "center",
                      flexWrap: "wrap"
                    }}>
                      <a className="primary-btn" href="#/schemes">
                        Browse Scheme Directory
                      </a>
                      <a className="outline-btn" href="#/find-help">
                        Find Help
                      </a>
                    </div>
                  </div>
                )}
              </div>
            </section>

            <Footer/>
          </main>
        );
      }

      const titles = [
        ["Your age", "Age helps us identify schemes with age-related eligibility conditions."],
        ["Your state / UT", "Some programmes are nationwide while others can have state-specific rules."],
        ["Income range", "Choose the closest annual household income range. Do not enter exact financial details."],
        ["Occupation", "Select the category that best describes your current occupation."]
      ];

      return (
        <main className="page">
          <div className="page-header">
            <div className="container">
              <div className="eyebrow">4-step checker</div>
              <h1 className="section-title">Check Your Rough Eligibility</h1>
              <p className="section-subtitle">
                No Aadhaar number, bank details or medical records are required.
              </p>
            </div>
          </div>

          <section className="section">
            <div className="container checker-shell">
              <div className="progress-label">
                <span>Step {step} of 4</span>
                <span>{Math.round(step / 4 * 100)}%</span>
              </div>

              <div className="progress">
                <div
                  className="progress-bar"
                  style={{width: `${step / 4 * 100}%`}}
                />
              </div>

              <div className="card form-card">
                <h2>{titles[step - 1][0]}</h2>
                <p>{titles[step - 1][1]}</p>

                {step === 1 && (
                  <div className="form-grid">
                    <div className="field full">
                      <label htmlFor="age">Age</label>
                      <input
                        id="age"
                        type="number"
                        min="0"
                        max="120"
                        placeholder="Enter your age"
                        value={form.age}
                        onChange={e => update("age", e.target.value)}
                      />
                    </div>
                  </div>
                )}

                {step === 2 && (
                  <div className="form-grid">
                    <div className="field full">
                      <label htmlFor="state">State / Union Territory</label>
                      <select
                        id="state"
                        value={form.state}
                        onChange={e => update("state", e.target.value)}
                      >
                        <option value="">Select your state / UT</option>
                        {states.map(state => (
                          <option value={state} key={state}>{state}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                )}

                {step === 3 && (
                  <div className="choice-grid">
                    {incomeOptions.map(option => (
                      <div
                        key={option.value}
                        className={"choice " + (form.income === String(option.value) ? "selected" : "")}
                        onClick={() => update("income", String(option.value))}
                      >
                        <strong>{option.label}</strong>
                        <span>Approximate annual income range</span>
                      </div>
                    ))}
                  </div>
                )}

                {step === 4 && (
                  <div className="choice-grid">
                    {occupations.map(occupation => (
                      <div
                        key={occupation}
                        className={"choice " + (form.occupation === occupation ? "selected" : "")}
                        onClick={() => update("occupation", occupation)}
                      >
                        <strong style={{textTransform: "capitalize"}}>
                          {occupation}
                        </strong>
                        <span>Select the closest category</span>
                      </div>
                    ))}
                  </div>
                )}

                <div className="form-actions">
                  {step > 1 ? (
                    <button
                      className="outline-btn"
                      onClick={() => setStep(step - 1)}
                    >
                      ← Back
                    </button>
                  ) : (
                    <span></span>
                  )}

                  {step < 4 ? (
                    <button
                      className="primary-btn"
                      disabled={!canContinue()}
                      onClick={() => canContinue() && setStep(step + 1)}
                      style={!canContinue() ? {opacity: .5, cursor: "not-allowed"} : {}}
                    >
                      Continue <Icon name="arrow" size={16}/>
                    </button>
                  ) : (
                    <button
                      className="primary-btn"
                      disabled={!canContinue()}
                      onClick={() => canContinue() && setSubmitted(true)}
                      style={!canContinue() ? {opacity: .5, cursor: "not-allowed"} : {}}
                    >
                      See Possible Matches
                    </button>
                  )}
                </div>
              </div>

              <div style={{marginTop: 20}}>
                <Disclaimer/>
              </div>
            </div>
          </section>

          <Footer/>
        </main>
      );
    }

    /* ============================================================

       ============================================================ */

    function Camps() {
      const [district, setDistrict] = useState("");
      const [service, setService] = useState("");

      const districts = [...new Set(camps.map(c => c.district))].sort();
      const services = [...new Set(camps.map(c => c.serviceType))].sort();

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const getStatus = (date) => {
        const d = new Date(date + "T00:00:00");
        return d >= today ? "Upcoming" : "Completed";
      };

      const filtered = camps
        .filter(camp =>
          (!district || camp.district === district) &&
          (!service || camp.serviceType === service)
        )
        .sort((a, b) => {
          const aUpcoming = getStatus(a.date) === "Upcoming";
          const bUpcoming = getStatus(b.date) === "Upcoming";

          if (aUpcoming && !bUpcoming) return -1;
          if (!aUpcoming && bUpcoming) return 1;

          if (aUpcoming && bUpcoming) {
            return new Date(a.date) - new Date(b.date);
          }

          return new Date(b.date) - new Date(a.date);
        });

      return (
        <main className="page">
          <div className="page-header">
            <div className="container">
              <div className="eyebrow">Health camps</div>
              <h1 className="section-title">Find Health Camps</h1>
              <p className="section-subtitle">
                Browse the embedded sample camp directory and filter by district
                or service type.
              </p>
            </div>
          </div>

          <section className="section-sm">
            <div className="container">
              <div className="camp-filters">
                <select
                  value={district}
                  onChange={e => setDistrict(e.target.value)}
                >
                  <option value="">All districts</option>
                  {districts.map(item => (
                    <option key={item}>{item}</option>
                  ))}
                </select>

                <select
                  value={service}
                  onChange={e => setService(e.target.value)}
                >
                  <option value="">All service types</option>
                  {services.map(item => (
                    <option key={item}>{item}</option>
                  ))}
                </select>
              </div>

              <div className="results-count">
                {filtered.length} camp{filtered.length !== 1 ? "s" : ""} shown
              </div>

              {filtered.length > 0 ? (
                <div className="grid camp-grid">
                  {filtered.map(camp => {
                    const status = getStatus(camp.date);

                    return (
                      <div className="card camp-card" key={camp.id}>
                        <div className="camp-card-top">
                          <span className="tag primary">
                            {camp.serviceType}
                          </span>

                          <span className={"status " + (
                            status === "Upcoming"
                              ? "upcoming"
                              : "completed"
                          )}>
                            {status}
                          </span>
                        </div>

                        <h3>{camp.name}</h3>

                        <div className="camp-organizer">
                          {camp.organizer}
                        </div>

                        <div className="camp-info">
                          <div className="camp-info-row">
                            <Icon name="calendar" size={17}/>
                            <span>
                              {new Date(camp.date + "T00:00:00").toLocaleDateString(
                                "en-IN",
                                {
                                  day: "numeric",
                                  month: "long",
                                  year: "numeric"
                                }
                              )}
                            </span>
                          </div>

                          <div className="camp-info-row">
                            <Icon name="location" size={17}/>
                            <span>{camp.venue}</span>
                          </div>

                          <div className="camp-info-row">
                            <Icon name="location" size={17}/>
                            <span>{camp.district} district</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="empty">
                  <h3>No camps found</h3>
                  <p>
                    Try removing one of the filters.
                  </p>
                </div>
              )}
            </div>
          </section>

          <Footer/>
        </main>
      );
    }

          title: "Insurance",
          icon: "insurance",
          text: "For people exploring government-supported insurance or accident protection programmes.",
          schemes: ["pmjay", "pmsby"],
          campTypes: ["General Health", "Screening"]
        },
        screening: {
          title: "Screening / Checkups",
          icon: "scan",
          text: "For people looking for preventive screening, child health checks, senior care or community health services.",
          schemes: ["rbsk", "nphce", "sickle", "healthwellness", "nhm"],
          campTypes: ["Screening", "Child Health", "Senior Citizen Health", "Eye Care"]
        }
      };

      const current = categories[selected];

      const selectedSchemes = current.schemes
        .map(id => schemes.find(s => s.id === id))
        .filter(Boolean);

      const selectedCamps = camps.filter(c =>
        current.campTypes.includes(c.serviceType)
      );

      return (
        <main className="page">
          <div className="page-header">
            <div className="container">
              <div className="eyebrow">Guided discovery</div>
              <h1 className="section-title">Find Help</h1>
              <p className="section-subtitle">
                Start with the type of help you are looking for. SchemeWise will
                narrow the sample directory for you.
              </p>
            </div>
          </div>

          <section className="section">
            <div className="container">
              <div className="grid help-options">
                {Object.entries(categories).map(([key, category]) => (
                  <div
                    className={"card help-option " + (selected === key ? "selected" : "")}
                    key={key}
                    onClick={() => setSelected(key)}
                  >
                    <div className="icon-box">
                      <Icon name={category.icon} size={23}/>
                    </div>

                    <h3>{category.title}</h3>
                    <p>{category.text}</p>
                  </div>
                ))}
              </div>

              <div className="help-guidance">
                <strong>{current.title}</strong>
                <span>{current.text}</span>
              </div>

              <h2 style={{fontSize: "1.35rem"}}>
                Relevant schemes
              </h2>

              <div className="grid scheme-grid" style={{marginTop: 18}}>
                {selectedSchemes.map(scheme => (
                  <div className="card scheme-card" key={scheme.id}>
                    <span className="tag primary">{scheme.benefitType}</span>
                    <h3 style={{marginTop: 8}}>{scheme.name}</h3>
                    <p className="scheme-summary">{scheme.summary}</p>

                    <div className="scheme-card-footer">
                      <span className="scheme-meta">{scheme.state}</span>
                      <a className="text-link" href={"#/schemes/" + scheme.id}>
                        View details →
                      </a>
                    </div>
                  </div>
                ))}
              </div>

              <h2 style={{fontSize: "1.35rem", marginTop: 45}}>
                Related camps
              </h2>

              <div className="grid camp-grid" style={{marginTop: 18}}>
                {selectedCamps.slice(0, 6).map(camp => (
                  <div className="card camp-card" key={camp.id}>
                    <span className="tag primary">{camp.serviceType}</span>
                    <h3>{camp.name}</h3>

                    <div className="camp-info">
                      <div className="camp-info-row">
                        <Icon name="calendar" size={17}/>
                        <span>
                          {new Date(camp.date + "T00:00:00").toLocaleDateString(
                            "en-IN",
                            {day: "numeric", month: "short", year: "numeric"}
                          )}
                        </span>
                      </div>

                      <div className="camp-info-row">
                        <Icon name="location" size={17}/>
                        <span>{camp.venue}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{marginTop: 35}}>
                <Disclaimer/>
              </div>
            </div>
          </section>

          <Footer/>
        </main>
      );
    }

    /* ============================================================
       ABOUT
       ============================================================ */

    function About() {
      return (
        <main className="page">
          <div className="page-header">
            <div className="container">
              <div className="eyebrow">About SchemeWise</div>
              <h1 className="section-title">Making public health information easier to navigate.</h1>
              <p className="section-subtitle">
                SchemeWise is a civic-tech prototype focused on health scheme
                discovery and basic eligibility guidance.
              </p>
            </div>
          </div>

          <section className="section">
            <div className="container about-grid">
              <div className="card about-card">
                <h2>Our Mission</h2>

                <p>
                  Government health programmes can be difficult to discover because
                  information is distributed across departments, portals and
                  programme pages.
                </p>

                <p>
                  SchemeWise brings a simplified discovery layer together in one
                  place. Users can explore schemes, perform a basic eligibility
                  check, browse sample health camps and find focused guidance.
                </p>

                <p>
                  The application is deliberately designed as an information and
                  guidance tool. It does not replace government verification,
                  professional healthcare advice or the official application
                  process.
                </p>

                <h2>Privacy by Design</h2>

                <ul className="detail-list">
                  <li>No login or account is required.</li>
                  <li>No Aadhaar numbers are requested.</li>
                  <li>No bank account details are requested.</li>
                  <li>No medical records are requested.</li>
                  <li>The eligibility checker operates against a local sample dataset.</li>
                  <li>Applications are never submitted by SchemeWise.</li>
                </ul>
              </div>

              <div>
                <div className="card about-card" id="developer">
                  <h2>About the Developer</h2>

                  <div className="developer-box">
                    <strong>Developer Name / Team</strong>
                    <p className="muted" style={{marginBottom: 0}}>
                      Developer bio placeholder. Add your name, college,
                      course, project role and a short description of your
                      interest in civic technology here.
                    </p>
                  </div>
                </div>

                <div className="card about-card" style={{marginTop: 22}}>
                  <h2>Technology</h2>

                  <div>
                    <span className="tag">HTML</span>
                    <span className="tag">CSS</span>
                    <span className="tag">JavaScript</span>
                    <span className="tag">React</span>
                    <span className="tag">ReactDOM</span>
                    <span className="tag">Babel</span>
                  </div>

                  <p className="muted">
                    This prototype is intentionally self-contained and runs
                    entirely in the browser.
                  </p>
                </div>
              </div>
            </div>
          </section>

          <section className="section-sm">
            <div className="container">
              <h2 style={{fontSize: "1.4rem"}}>Full Disclaimer</h2>
              <Disclaimer/>
            </div>
          </section>

          <Footer/>
        </main>
      );
    }

    /* ============================================================
       APP
       ============================================================ */

    function App() {
      const [route, setRoute] = useState(getRoute());

      useEffect(() => {
        const handleHashChange = () => {
          setRoute(getRoute());
          window.scrollTo(0, 0);
        };

        window.addEventListener("hashchange", handleHashChange);

        if (!window.location.hash) {
          window.location.hash = "#/";
        }

        return () => {
          window.removeEventListener("hashchange", handleHashChange);
        };
      }, []);

      let page;

      switch (route.page) {
        case "eligibility":
          page = <Eligibility/>;
          break;

        case "schemes":
          page = <Schemes/>;
          break;

        case "scheme-detail":
          page = <SchemeDetail id={route.id}/>;
          break;

        case "camps":
          page = <Camps/>;
          break;

        case "find-help":
          page = <FindHelp/>;
          break;

        case "about":
          page = <About/>;
          break;

        case "home":
        default:
          page = <Home/>;
      }

      return page;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
